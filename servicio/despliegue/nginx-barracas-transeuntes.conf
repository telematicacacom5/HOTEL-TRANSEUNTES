# Sitio de control de las barracas de transeúntes.
#
#   sudo cp nginx-barracas-transeuntes.conf /etc/nginx/sites-available/barracas-transeuntes
#   sudo ln -s /etc/nginx/sites-available/barracas-transeuntes /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cambiar DOMINIO por el subdominio asignado y las rutas del certificado.

server {
    listen 80;
    server_name DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name DOMINIO;

    ssl_certificate     /etc/ssl/certs/barracas-transeuntes.crt;
    ssl_certificate_key /etc/ssl/private/barracas-transeuntes.key;

    root /var/www/barracas-transeuntes;
    index index.html;

    # El repositorio git de la carpeta no se sirve nunca.
    location ~ /\.git { deny all; return 404; }

    # Se relee cada 45 segundos: nunca desde caché.
    location = /data/estancias.json {
        add_header Cache-Control "no-store" always;
    }

    location = /api/estancias {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
